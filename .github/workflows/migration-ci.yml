name: Migration CI

on:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "scripts/verify_database.sql"
      - ".github/workflows/migration-ci.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "scripts/verify_database.sql"

permissions:
  contents: read

jobs:
  db-reset:
    name: supabase db reset (migrations apply cleanly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Supabase CLI is the lockfile's, installed by `npm ci` exactly as ORVION Acceptance does.
      # A `uses:` pin here was a second version authority: it stayed at 2.109.1 after the lockfile
      # moved to 2.120.0, so the two CI database lanes tested different CLIs (SPEC-272).
      - name: Install pinned toolchain
        run: npm ci

      - name: Start local Supabase stack
        run: pwsh -NoProfile -Command '. ./scripts/assert_founder_local.ps1; Assert-FounderLocalTarget -Root $env:GITHUB_WORKSPACE | Out-Null' && node_modules/.bin/supabase start --workdir "$GITHUB_WORKSPACE"

      - name: Apply all migrations on a clean database
        run: pwsh -NoProfile -Command '. ./scripts/assert_founder_local.ps1; Assert-FounderLocalTarget -Root $env:GITHUB_WORKSPACE | Out-Null' && node_modules/.bin/supabase db reset --local --workdir "$GITHUB_WORKSPACE"

      - name: Run pgTAP invariant tests
        run: pwsh -NoProfile -Command '. ./scripts/assert_founder_local.ps1; Assert-FounderLocalTarget -Root $env:GITHUB_WORKSPACE | Out-Null' && node_modules/.bin/supabase test db --local --workdir "$GITHUB_WORKSPACE"

      - name: Run database smoke-test (verify_database.sql)
        run: docker exec -i supabase_db_ORVION_FOUNDER psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f - < scripts/verify_database.sql

      - name: Stop local Supabase stack
        if: always()
        run: |
          pwsh -NoProfile -Command '. ./scripts/assert_founder_local.ps1; Assert-FounderLocalTarget -Root $env:GITHUB_WORKSPACE | Out-Null' || exit $?
          node_modules/.bin/supabase stop --project-id ORVION_FOUNDER --workdir "$GITHUB_WORKSPACE" || true
